# Threshold Owner. Any relaxation needs two keys (SPEC/00 §5 `two-key`).
# Each bar says which direction relaxes it.
# Opened at M00 PR 2 by ruling of the Threshold Owner: R3-5 in
# milestones/M00/feasibility.md §2, carried by milestones/M00/rulings/pr2.md.
# Changed at M01 PR 1 with two keys: Threshold Owner in
# milestones/M01/rulings/pr1-threshold-owner.md, Engineering in
# milestones/M01/rulings/pr1.md (ruling B; M01 open items 5, 22, 23).
# M04 PR 2: `relative` added (SPEC/04 §2; milestones/M04/rulings/
# pr2-threshold-owner.md). Adding a bar is not a relaxation (ADR-0009).
# M07 PR 2: `upgrade` added, three bars (SPEC/07 §2; milestones/M07/rulings/
# pr2-threshold-owner.md, item 1, ruled 2026-10-02). No existing bar moves.

# cost-cap: total tokens, in plus out, for one `make evals` run.
# A budget, not a quality bar. Relaxes upward: a higher number needs two keys.
# At M00 it was 20000 for one subject: the PR 1 plant run spent 5,662, the
# worst case about 11,500. From M01 a run has two subjects. Measured at M03's
# close and M04 PR 1 (M04 open.md row 12): cb06c0d spent 52,131 (refagent
# on Sonnet 4.6 44,626, the control 7,505) and e518927 52,652 (44,963 and
# 7,689). refagent has one tool and no retrieval (the knowledge base is
# M06). From M04 PR 2 A-vs-A runs both subjects twice where SPEC/04 §4 says,
# about 105,000; the cap is re-ruled against that run's envelope, and a
# raise is two keys (ADR-0009). The envelope's tokens_in and tokens_out
# count every run the job made: both subjects when an agent ran, and both
# runs of each under A-vs-A; the control's when none did. An
# envelope over the cap is written RED by verdict.build and read RED by
# verdict.gate (item 22), whichever its subject.
cost_cap:
  tokens_per_run: 150000

# The base every later number is a delta against: the baseline card at tag
# m00, the one row 0 cites (evals/history/9407615….json), not the last card
# on the tagged tree (55dadb2). verdict.build refuses a card with another
# hash, and verdict.gate rejects an envelope that names one (ADR-0004
# amendment 2). The hash is of the card's content (canonical_sha256).
#
# The card's `region` is the request region: the inference profile ARN's,
# us-west-2. Converse does not return the region that served the call, and
# it is not recorded (Threshold Owner with Security, item 23).
baseline_card:
  path: evals/history/9407615dcde09308490f6699c21a18100bfedcd2.baseline-card.json
  sha256: b0219756cad63be67fb51aa4632dd015084840833341f15235fab4569adc3295

# Threshold Owner (M02 PR 2, milestones/M02/rulings/pr2-threshold-owner.md).
# The platform's ceilings: the most any manifest may ask for (SPEC/00 §6:
# depth 2, fan-out 3; concurrency and per-edge rps at refagent's M01
# values, the only tenant that has run). `make validate` fails a manifest
# whose `ceilings` exceed these. Each relaxes upward.
ceilings:
  concurrency: 2
  rps_per_edge: 1
  depth: 2
  fan_out: 3

# Threshold Owner (M04 PR 2; SPEC/04 §2, ruling 2 and the ruling on
# finding 3 at M04 PR 1): `delta_max`, relative to the incumbent. It
# applies to p95 latency and to the agent's tokens per run, never to
# goldens: a golden that has passed and now fails blocks under any model
# (P7, R2). The incumbent is the pin at the merge-base with main; "its"
# number is the median over its envelopes in evals/history/ on that
# profile and region, in the same mode as the envelope ruled (envelopes
# with no mode are not counted). The run's side is its first agent run.
# No incumbent envelope in that mode is a fail, not a pass. Every agent
# envelope is held to both, not only a swap's (threshold-owner F4). Each
# relaxes upward; a higher ratio needs two keys.
#
# On the counted set at M04 PR 2 (Sonnet 4.6, us-west-2): 8 runner
# envelopes, p95 4,845 to 8,641 ms, median 5,852, the slowest 1.48x it;
# 6 runtime envelopes, 5,415 to 7,996, median 6,155, the slowest 1.30x.
# Agent tokens: runner 44,528 to 48,516, median 48,213; runtime 44,963 to
# 48,154, median 48,027 (threshold-owner N12 on M04 PR 1: the numbers
# restated on the set the bar counts).
relative:
  p95_ratio_max: 2.0
  agent_tokens_ratio_max: 1.5

# Threshold Owner (M05 PR 2; SPEC/05 §2, finding 11 on M05 PR 1): N, R10's
# detection bar. An attempt's record must be an object in the security
# account's audit bucket no more than this many seconds after the attempt's
# own time, which is AWS's record of it (CloudTrail's eventTime, the flow
# record's start), never a time a human wrote. Read by the ledger's row 5
# reading of an envelope's `containment` and by build, which writes
# `alarm_latency_s`, the largest such difference. Added before its reader;
# adding a bar is not a relaxation (ADR-0009). The margin is thin:
# CloudTrail delivers to S3 in about five minutes on average, with no
# guarantee, and flow logs publish about every five minutes even at a
# one-minute aggregation. A miss is the finding, not a bar to move. Relaxes
# upward.
detection:
  max_seconds: 600

# Threshold Owner (M06 PR 2; SPEC/06 section 1, finding 8 on M06 PR 1):
# claim 6's bar. The timed quickstart's elapsed time, from the agent
# repository's created_at to the last of its timed records (the first pull
# request refused then merged, the platform's deploy run that wrote the
# agent's first answer, that answer to one of its own goldens), every time
# GitHub's or AWS's. The registry row must hold the agent and panel 1 must
# list it; neither is timed: the row's time is a runner's clock, and the
# panel is read when asked (threshold-owner F2, N8 on M06 PR 2). One working
# day, wall clock, breaks not subtracted. Absolute, not relative: it is not
# a quality bar and has no incumbent to be relative to (SPEC/00 section 8
# M04: one policy is about quality bars; threshold-owner F1 on M06 PR 2).
# Read by build into `template` and by row 6's reading of it; gates no pull
# request. Added before S3 is timed; adding a bar is not a relaxation
# (ADR-0009). Relaxes upward.
quickstart:
  max_seconds: 28800

# Threshold Owner (M07 PR 2; SPEC/07 section 2 "The limits"; ruled
# 2026-10-02, milestones/M07/rulings/pr2-threshold-owner.md item 1): claim
# 7's three limits. Each is a time between two records, every time GitHub's
# or AWS's, never a runner's clock or a person's.
# - arrive_max_seconds: from an upgrade's trigger (the template's push, the
#   model-watch run, the retire run) to the `created_at` of the pull request
#   the platform opened. platform-upgrade.yml and the retire job run every
#   15 minutes, so one period plus an hour.
# - deploy_max_seconds: from a pull request's `merged_at` to the deploy run
#   of that merge completed.
# - retire_max_seconds: from the retirement pull request's `merged_at` to
#   `DeleteAgentRuntime` in CloudTrail.
# Absolute, not relative: none is a quality bar and none has an incumbent
# (as quickstart.max_seconds; threshold-owner F1 on M06 PR 2). Read by build
# into `upgrade` and by row 7's reading of it; they gate no pull request.
# GitHub may delay a scheduled run: a miss is the finding, not a bar to
# move. Added before any attempt; adding a bar is not a relaxation
# (ADR-0009). Each relaxes upward.
upgrade:
  arrive_max_seconds: 4500
  deploy_max_seconds: 3600
  retire_max_seconds: 3600

# Threshold Owner (M02 PR 2): which direction relaxes each bar, read by
# `two-key` (src/gates/two_key.py) instead of the comments above. A bar is a
# numeric leaf under the mappings in this file; `baseline_card` is a pin,
# not a bar (M01 PR 1, ruling 3: a new base is ruled, not built). A bar with
# no entry here, or an entry that names no bar, fails `make validate`, and
# `two-key` refuses a move on a bar whose direction it cannot read.
relaxes:
  cost_cap.tokens_per_run: up
  ceilings.concurrency: up
  ceilings.rps_per_edge: up
  ceilings.depth: up
  ceilings.fan_out: up
  relative.p95_ratio_max: up
  relative.agent_tokens_ratio_max: up
  detection.max_seconds: up
  quickstart.max_seconds: up
  upgrade.arrive_max_seconds: up
  upgrade.deploy_max_seconds: up
  upgrade.retire_max_seconds: up
