# infra/platform_grant.yaml (Security). What each of the platform's three
# GitHub Apps may hold, and the environments that hold their keys.
# `scripts/platform_check.py grant` reads what GitHub says an App holds and
# stops its keyed job on anything beyond this file. It is read from the
# job's checkout, which is `main`'s: each key's environment deploys from
# `main` only, so a pull request cannot widen the grant it is checked
# against.
#
# Ruled in milestones/M07/rulings/pr2-security.md on 2026-10-02 (items 2, 3,
# 6 and 13a), where this block first stood. Moved here at M07 PR 3 (item
# 13j; security-reviewer 5 on M07 PR 2): under milestones/ it was on
# Product's path, so a pull request that widened it met no Security gate.
# /infra/ is Security's, so a change here needs a Security ruling
# (`ruling-cited`). The block in pr2-security.md stays as the record of
# what was ruled then; nothing reads it now.
#
# `ruled_in` names the ruling file that rules this file. The reader refuses
# the grant unless that file is on the checkout, its seat is Security, and
# it carries a line that starts "Ruled by": a draft is not a grant. That is
# a guard against a draft and nothing more: the reader does not hold these
# bytes to that ruling, so a later change here that left `ruled_in` alone
# would be read as ruled. What holds a later change is `ruling-cited` on
# /infra/, at the pull request (security-reviewer 2 on M07 PR 3).
ruled_in: milestones/M07/rulings/pr3-security.md

# The one repository the seeded relaxation may be pointed at (seed S0's
# third attempt; pr2-security.md items 8 and 13g). Until M07 PR 3 the reader
# took it from the seed's run file, which is on Product's path.
relax_seed:
  repository: agentkeel-studio/owner-check

grant:
  agentkeel-platform:
    app_id: 5144253
    environment: platform-app
    installed_on: [agentkeel-studio]
    repository_selection: all
    permissions: {administration: write, checks: write, contents: read, metadata: read, pull_requests: read}
  agentkeel-upgrades:
    app_id: 5169860         # created 2026-10-03 UTC; on main by #42, the ids pull request (rulings/grant-ids-security.md)
    public: true            # item 13a: installed on two accounts, so GitHub makes it public
    environment: platform-upgrades
    installed_on: [agentkeel-studio, andaro74]
    repository_selection: {agentkeel-studio: all, andaro74: [agentkeel]}
    permissions: {contents: write, pull_requests: write, metadata: read}
  agentkeel-observer:
    app_id: 5169892         # created 2026-10-03 UTC, first with the writer's permissions, corrected within the hour; on main by #42
    environment: platform-observer
    installed_on: [agentkeel-studio]
    repository_selection: all
    permissions: {administration: read, checks: read, contents: read, metadata: read, pull_requests: read}
  environments:
    branch_policies: [{name: main, type: branch}]
    can_admins_bypass: false
    secrets: one each, the App's key, and not a repository secret
