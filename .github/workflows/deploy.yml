# deploy (SPEC/01 §6, M01 PR 2). Security seat.
# Authorised by SPEC/00-overview.md#8-M01 and milestones/M01/rulings/pr2.md.
# Its hash is listed in infra/workflows.sha256, which `make validate` reads.
#
# M02 PR 2: the deploy job runs on an arm64 runner and the build step reads
# the image's architecture. AgentCore Runtime runs arm64 images only; the
# two images this file built on x86 were amd64, and the runtime never
# started from the first (run 35734541276, "parent snapshot ... does not
# exist") and refused the second ("Architecture incompatible"). The
# repository is public, so the arm64 runner is free.
#
# On `main` only. Packs refagent's bundle, signs the archive with cosign
# keyless, verifies it, builds and pushes the image, verifies again inside
# the job that deploys, and deploys `AgentkeelRefagent` through the deploy
# role. Four things are worth reading closely.
#
# 1. **The identity is this file on main.** `src/bundle/verify.py` accepts
#    one identity for a deploy (ruling g):
#    https://github.com/andaro74/agentkeel/.github/workflows/deploy.yml@refs/heads/main
#    and refuses anything else, including sign-fixture.yml's. It also reads
#    the certificate's Fulcio source-repository id, so a fork of this file
#    under the same name signs nothing that deploys here.
# 2. **Verify runs twice.** Once where the signature is made, and again at
#    the start of the deploy job, on the bytes that job holds. The second
#    run is the one that matters: it is the only one whose subject is the
#    bytes being deployed.
# 3. **The image is pinned by digest.** The repository is tag-immutable
#    (infra/bootstrap), so the digest cannot be moved to other bytes, and
#    the stack is synthesised with that digest.
# 4. **The load check.** After the deploy, `verify` runs once more against
#    the bundle the runtime was built from, and the runtime is called once.
#    It runs outside the bundle's own code (SPEC/01 §6, the repair on
#    platform-architect BLOCK 3).
#
# **Until M01 PR 3 it refused at its first step** (BLOCK F): the execution
# role had no service grants, so a run would have failed partway. The
# `refuse` job was deleted in PR 3, after the bootstrap stack was redeployed
# with the grants and `simulate-principal-policy` read them back from the
# account with 0 mismatches (milestones/M01/rulings/pr3.md). The first
# run of this file is the merge of PR 3.
#
# What this does not do, and what M01 does not claim it does. **No deploy
# has run.** This path is written at M01 PR 2 and is not what row 1
# measures: S1 and S2 are measured by `verify` in the PR run, S3, S5 and S8
# at synth, S4 and S6 against the deployed bootstrap stack (SPEC/01 §5).
# Until a run of this file is in the record, nothing here has fired on a
# seeded case, and no prose may call it proven (SPEC/00 §10.5).
#
# **From M06 PR 2 it also deploys every agent from the template** (SPEC/06
# section 6, R3), on a schedule from main, so the deploy role's trust, the
# eval role's and `verify`'s identity stay exactly as they were: an agent
# repository can assume nothing and sign nothing. `find-agents` (no secret)
# lists each organisation repository whose default-branch head the platform's
# App passed. `sign-agent` (no AWS credentials) checks that head out **as
# data**, checks it again with agentkeel's code, packs and signs it as this
# file on main, and builds its image from `infra/construct/agent.Dockerfile`,
# never the agent's own. `deploy-agent` (the deploy role) skips a commit the
# registry already holds, refuses a name another repository holds, verifies
# the bytes, pushes the image to `agentkeel/<name>`, deploys `agentkeel-<name>`
# through the execution role, loads the agent's own table, asks the deployed
# agent its own goldens (`build answer`), writes the registry row, and puts
# the answer record once in the security account (`agentkeel-answer-put`, which
# may put under `envelopes/agents/` and nothing else).
# refagent's two jobs below are unchanged but for the registry row.
#
# **From M07 PR 2 it also retires an agent** (SPEC/07 section 1, section 6;
# milestones/M07/rulings/pr2-security.md items 2, 4, 6 and 11, ruled
# 2026-10-02). A retirement arrives as a pull request the platform opened,
# and the deploy path, finding `rollout: retired` at a head the App passed,
# retires instead of deploying:
#
# - `retire-plan` (no secret) writes the one change, `rollout: retired`, for
#   the agent a dispatch names (`gh workflow run deploy.yml -f retire=<name>`,
#   the seeded trigger) or, on the schedule, for each agent whose pin is 30
#   days or fewer from its `deprecated_after`. The input reaches the script
#   through `env:`, never interpolated, and is held to the agent name
#   pattern; `refagent` is refused. `retire-open` runs in the environment
#   `platform-upgrades` with the key of the App that opens pull requests:
#   the grant read back first, the plan checked again (one file, one field),
#   then one draft pull request in the agent's repository.
# - `find-agents` lists a merged head that says `rollout: retired` apart: it
#   is never signed or deployed. `retire-agent` (the deploy role) checks that
#   head again with agentkeel's code, keeps the runtime's ARN on the registry
#   row, and updates the agent's stack to the construct's template **without
#   the runtime** (infra/construct/). That update is the retirement: the
#   execution role already may delete a template agent's runtime, and
#   nothing is granted for it. Then one invocation of the ARN, recorded raw.
#   Only when it is refused with ResourceNotFoundException is the retirement
#   put once under envelopes/agents/<name>/retired.json in the security
#   account, and `retired_at` written on the registry row, which stays. On
#   any other result the job fails and the next run asks again. A name with
#   `retired_at` is not deployed again: `registry.py claim` refuses it.
#   The stack, the role, the key, the table and the logs are kept
#   (milestones/M07/runs/f7_2_removed_and_kept.md). It is one-way.
#
# And every deploy of an agent from the template puts its signed archive
# once under bundles/<name>/<commit>.tar in the audit bucket, since the
# Actions artifact expires after 30 days. refagent's own two jobs are not
# changed: its bundle is not put there, and it is never retired.
#
# Repaired at M07 PR 2 (re-read of 52ebd57 at M07 PR 1): when the answer
# record is already in the bucket (a 412), the registry row says the record
# standing is an earlier run's (`answer_put: stood`), where it named this
# run against a record this run did not write.
#
# None of the retirement has run: S2's attempt is made after M07 PR 2
# merges, last.
name: deploy

on:
  push:
    branches: [main]
    paths:
      - agents/refagent/**
      - infra/construct/**
      - .github/workflows/deploy.yml
      # M03 PR 2 (SPEC/03 §6, seed S1's reader): a change to the rights table
      # alone reloads it, so the runtime answers from the table on main.
      # load_rights_table.py sets the marker the runtime match reads.
      - data/rights_table.json
  # M06 PR 2: an agent from the template, deployed from main (R3).
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      retire:
        description: "An agent to retire: the platform opens a draft pull request in its repository that sets rollout: retired. Leave empty to deploy."
        required: false
        default: ""
        type: string

permissions: {}

concurrency:
  group: deploy-${{ github.event_name == 'push' && 'refagent' || 'agents' }}
  cancel-in-progress: false

env:
  BUNDLE: agents/refagent
  IMAGE: agentkeel-refagent
  REGION: us-west-2
  STACK: AgentkeelRefagent

jobs:
  sign:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # OIDC to Fulcio, keyless
    outputs:
      digest: ${{ steps.pack.outputs.digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Install
        run: uv sync --frozen

      - name: Pack the bundle
        id: pack
        run: |
          set -euo pipefail
          uv run python -m src.bundle.pack "$BUNDLE" --out "$BUNDLE/dist" | tee pack.out
          # NR==1 and one field: a second line would otherwise set a second
          # output, and this value is used in the job that holds the deploy role.
          echo "digest=$(awk 'NR==1{print $1}' pack.out)" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2

      - name: Sign the archive, keyless
        run: cosign sign-blob --yes --bundle "$BUNDLE/bundle.cosign.json" "$BUNDLE/dist/bundle.tar"

      # The first of the two verifies. The identity is this workflow on main,
      # which is the only one a deploy accepts.
      - name: Verify what was just signed
        run: uv run python -m src.bundle.verify "$BUNDLE"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-bundle
          path: |
            ${{ env.BUNDLE }}/bundle.cosign.json
            ${{ env.BUNDLE }}/dist/bundle.tar
          if-no-files-found: error
          retention-days: 90

  deploy:
    needs: sign
    runs-on: ubuntu-24.04-arm # arm64: the only architecture AgentCore Runtime runs (M02 PR 2)
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # OIDC to AWS, as the deploy role
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Install
        run: uv sync --frozen

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-bundle
          path: ${{ env.BUNDLE }}

      # The second verify, on the bytes this job will deploy. If the tree
      # this job checked out differs from the tree that was signed by one
      # byte, the digest does not match and the deploy stops here.
      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2

      - name: Verify the bytes this job deploys
        run: uv run python -m src.bundle.verify "$BUNDLE"

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: agentkeel-deploy-${{ github.run_id }}
          role-duration-seconds: 3600
          aws-region: us-west-2

      - uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1
        id: ecr

      - name: Build and push the image
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          # Through the environment, never interpolated into the script: this
          # job holds the deploy role, and ${{ }} is expanded before bash sees it.
          TAG: ${{ needs.sign.outputs.digest }}
        run: |
          set -euo pipefail
          # The tag is the bundle digest, so the image and the bundle it was
          # built from carry the same name. The repository is tag-immutable,
          # so this tag can be written once.
          tag="$TAG"
          # A rerun of the same bundle — a retry after a failed deploy, or a
          # construct-only change — finds its tag already pushed, and a
          # tag-immutable repository refuses a second push under it. The
          # image already there is the one built for these bundle bytes, so
          # it is reused by digest (PR 3 security-reviewer, F3). Reading it
          # takes ecr:BatchGetImage, which the deploy role already has.
          existing=$(aws ecr batch-get-image --repository-name "$IMAGE" --image-ids imageTag="$tag" \
            --query 'images[0].imageId.imageDigest' --output text)
          # AgentCore Runtime runs arm64 only (M02 PR 2). An image of any other
          # architecture is refused here, before a push or a reuse, with its
          # digest named: the runtime accepted an amd64 image once and never
          # started from it, and the tag is immutable, so a wrong image under
          # it has to be deleted by hand before this step can rebuild.
          refuse_unless_arm64() {
            arch=$(docker inspect --format='{{.Architecture}}' "$1")
            if [ "$arch" != "arm64" ]; then
              echo "::error::$1 is $arch; AgentCore Runtime runs arm64 only. Delete it from ECR by digest and rerun."
              exit 1
            fi
          }
          if [ -n "$existing" ] && [ "$existing" != "None" ]; then
            digest="$existing"
            docker pull "$REGISTRY/$IMAGE@$digest"
            refuse_unless_arm64 "$REGISTRY/$IMAGE@$digest"
            echo "image $REGISTRY/$IMAGE:$tag exists; reusing $digest (arm64)" >> "$GITHUB_STEP_SUMMARY"
          else
            docker build -f "$BUNDLE/Dockerfile" -t "$REGISTRY/$IMAGE:$tag" .
            refuse_unless_arm64 "$REGISTRY/$IMAGE:$tag"
            docker push "$REGISTRY/$IMAGE:$tag"
            digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$REGISTRY/$IMAGE:$tag" | cut -d@ -f2)
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "image $REGISTRY/$IMAGE@$digest" >> "$GITHUB_STEP_SUMMARY"

      # The execution role by its fixed name (item 7, M01 PR 3). This step
      # used to read it from `describe-stacks --stack-name AgentkeelBootstrap`,
      # but the deploy role may describe `stack/agentkeel-*/*` only, and IAM
      # ARN matching is case-sensitive, so the call would have been refused.
      # get-caller-identity needs no grant, and the name is the one the
      # deploy role's PassRole already names.
      - name: Deploy refagent's stack
        env:
          AGENTKEEL_IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          uv run python -m infra.construct.app
          aws cloudformation deploy \
            --stack-name agentkeel-refagent \
            --template-file "infra/construct/cdk.out/$STACK.template.json" \
            --capabilities CAPABILITY_NAMED_IAM \
            --role-arn "arn:aws:iam::$(aws sts get-caller-identity --query Account --output text):role/agentkeel-cfn-exec" \
            --no-fail-on-empty-changeset

      # The copy is the file: rows it lacks are deleted, and the marker is set
      # to the digest of the table scanned back, or left "loading" and the job
      # fails (M03 PR 2). A failed load leaves every run in the runner.
      - name: Load the rights table
        run: uv run python scripts/load_rights_table.py --table "$IMAGE-rights"

      # The load check (SPEC/01 §6). It runs here, outside the bundle's own
      # code, and it checks the cosign signature, not a digest the deployer
      # wrote down. Then one call, so "loads" means something that happened.
      - name: The check at load
        run: |
          set -euo pipefail
          uv run python -m src.bundle.verify "$BUNDLE"
          arn=$(aws cloudformation describe-stacks --stack-name agentkeel-refagent \
            --query "Stacks[0].Outputs[?OutputKey=='RuntimeArn'].OutputValue" --output text)
          AGENTKEEL_RUNTIME_ARN="$arn" uv run python -m src.agent.run --out "$RUNNER_TEMP/after-deploy.json" \
            --goldens evals/goldens/v1
          echo "deployed and answered: $arn" >> "$GITHUB_STEP_SUMMARY"

      # M06 PR 2 (SPEC/06 section 6, item 9): refagent's row in the registry, held by this repository.
      - name: refagent's row in the registry
        env:
          RUN_ID: ${{ github.run_id }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          uv run python scripts/registry.py claim --name refagent --repository andaro74/agentkeel --repository-id 1376369685
          uv run python scripts/registry.py write --name refagent --repository andaro74/agentkeel \
            --repository-id 1376369685 --commit "$COMMIT" --run-id "$RUN_ID"

  # --- M06 PR 2: an agent from the template (SPEC/06 section 6, R3) -----------

  # The deploy role here too, to read the registry and drop a commit already deployed before anything is
  # signed (security-reviewer N5 on M06 PR 2: otherwise every agent is signed into Rekor every ten minutes).
  # No agent repository's content is checked out in this job; it reads GitHub's API and the registry.
  find-agents:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # OIDC to AWS, as the deploy role, for the registry read
    outputs:
      agents: ${{ steps.find.outputs.agents }}
      retiring: ${{ steps.find.outputs.retiring }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Install
        run: uv sync --frozen

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: agentkeel-find-agents-${{ github.run_id }}
          role-duration-seconds: 900
          aws-region: us-west-2

      - name: The heads the platform's App passed, less what the registry holds
        id: find
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          uv run python scripts/platform_check.py deployable --skip-deployed --out "$RUNNER_TEMP/agents.json" \
            --retiring "$RUNNER_TEMP/retiring.json"
          echo "agents=$(cat "$RUNNER_TEMP/agents.json")" >> "$GITHUB_OUTPUT"
          # M07 PR 2: the heads that say rollout: retired, which the registry does not yet call retired.
          echo "retiring=$(cat "$RUNNER_TEMP/retiring.json")" >> "$GITHUB_OUTPUT"

  sign-agent:
    needs: find-agents
    if: needs.find-agents.outputs.agents != '[]' && needs.find-agents.outputs.agents != ''
    runs-on: ubuntu-24.04-arm # the image is arm64, as refagent's
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # OIDC to Fulcio, keyless: the identity is this file on main
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(needs.find-agents.outputs.agents) }}
    env:
      NAME: ${{ matrix.name }}
      REPOSITORY: ${{ matrix.repository }}
      COMMIT: ${{ matrix.commit }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.commit }}
          path: agent-src
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Install
        run: uv sync --frozen

      # Again, at the commit being deployed: the App passed it, and this is agentkeel's code saying so here.
      # The seats' access was read with the App's token when it passed, and is not read again here.
      - name: The head is still what the platform check passed
        run: >-
          uv run python -m src.validate.agent evaluate --agent agent-src --repository "$REPOSITORY"
          --head "$COMMIT" --defer-seat-access --out "$RUNNER_TEMP/check.json"

      - name: Place the agent at agents/<name>, without its git or workflow files
        run: |
          set -euo pipefail
          mkdir -p "agents/$NAME"
          rsync -a --exclude .git --exclude .github agent-src/ "agents/$NAME/"

      - name: Pack the bundle
        run: uv run python -m src.bundle.pack "agents/$NAME" --out "agents/$NAME/dist"

      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2

      - name: Sign the archive, keyless, as this file on main
        run: cosign sign-blob --yes --bundle "agents/$NAME/bundle.cosign.json" "agents/$NAME/dist/bundle.tar"

      - name: Verify what was just signed
        run: uv run python -m src.bundle.verify "agents/$NAME"

      # The platform's Dockerfile, with no AWS credentials in this job: nothing of the agent's runs here.
      - name: Build the image
        run: |
          set -euo pipefail
          docker build -f infra/construct/agent.Dockerfile --build-arg "AGENT=$NAME" -t "agent:$COMMIT" .
          arch=$(docker inspect --format='{{.Architecture}}' "agent:$COMMIT")
          test "$arch" = arm64 || { echo "::error::the image is $arch; AgentCore Runtime runs arm64 only"; exit 1; }
          docker save "agent:$COMMIT" -o "$RUNNER_TEMP/image.tar"

      # One folder, uploaded whole, so the artifact holds agents/<name>/bundle.cosign.json,
      # agents/<name>/dist/bundle.tar and image.tar, which is where deploy-agent reads them. Until M07 PR 3
      # the three were uploaded as paths under two roots (the workspace and the runner's temp folder);
      # GitHub roots an artifact at its paths' common parent, so they landed under agentkeel/agentkeel/ and
      # _temp/, and deploy-agent's first read failed (run 37023118799, the first deploy of an agent from
      # the template to get this far).
      - name: Stage what deploy-agent reads, under one folder
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/signed/agents/$NAME/dist"
          cp "agents/$NAME/bundle.cosign.json" "$RUNNER_TEMP/signed/agents/$NAME/"
          cp "agents/$NAME/dist/bundle.tar" "$RUNNER_TEMP/signed/agents/$NAME/dist/"
          mv "$RUNNER_TEMP/image.tar" "$RUNNER_TEMP/signed/image.tar"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-${{ strategy.job-index }}
          path: ${{ runner.temp }}/signed
          if-no-files-found: error
          retention-days: 30

  # always(): a leg of sign-agent that failed must not skip every other agent's deploy (security-reviewer F3
  # on M06 PR 2). A leg whose signing failed has no artifact, and fails at its download alone.
  deploy-agent:
    needs: [find-agents, sign-agent]
    if: always() && needs.find-agents.result == 'success' && needs.find-agents.outputs.agents != '[]' && needs.find-agents.outputs.agents != ''
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write # OIDC to AWS, as the deploy role, then as the envelope put role
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.find-agents.outputs.agents) }}
    env:
      NAME: ${{ matrix.name }}
      REPOSITORY: ${{ matrix.repository }}
      REPOSITORY_ID: ${{ matrix.repository_id }}
      COMMIT: ${{ matrix.commit }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.commit }}
          path: agent-src
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Install
        run: uv sync --frozen

      - name: Place the agent at agents/<name>
        run: |
          set -euo pipefail
          mkdir -p "agents/$NAME"
          rsync -a --exclude .git --exclude .github agent-src/ "agents/$NAME/"
          rm -rf agent-src

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agent-${{ strategy.job-index }}
          path: ${{ runner.temp }}/signed

      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2

      # The bytes this job holds, against the signature made in sign-agent.
      - name: Verify the bytes this job deploys
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/signed/agents/$NAME/bundle.cosign.json" "agents/$NAME/"
          uv run python -m src.bundle.verify "agents/$NAME"

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: agentkeel-deploy-agent-${{ github.run_id }}
          role-duration-seconds: 3600
          aws-region: us-west-2

      - name: Already deployed, or a name another repository holds
        id: registry
        run: |
          set -euo pipefail
          if uv run python scripts/registry.py deployed --name "$NAME" --commit "$COMMIT"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            uv run python scripts/registry.py claim --name "$NAME" --repository "$REPOSITORY" --repository-id "$REPOSITORY_ID"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1
        if: steps.registry.outputs.skip == 'false'
        id: ecr

      - name: Push the image to agentkeel/<name>
        if: steps.registry.outputs.skip == 'false'
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          tag=$(uv run python -c 'import sys; from src.bundle.pack import digest; print(digest(__import__("pathlib").Path(sys.argv[1])))' "$RUNNER_TEMP/signed/agents/$NAME/dist/bundle.tar")
          docker load -i "$RUNNER_TEMP/signed/image.tar"
          docker tag "agent:$COMMIT" "$REGISTRY/agentkeel/$NAME:$tag"
          existing=$(aws ecr batch-get-image --repository-name "agentkeel/$NAME" --image-ids imageTag="$tag" \
            --query 'images[0].imageId.imageDigest' --output text 2>/dev/null || true)
          if [ -n "$existing" ] && [ "$existing" != "None" ]; then
            digest="$existing"
          else
            docker push "$REGISTRY/agentkeel/$NAME:$tag"
            digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$REGISTRY/agentkeel/$NAME:$tag" | cut -d@ -f2)
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "image $REGISTRY/agentkeel/$NAME@$digest" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy agentkeel-<name>
        if: steps.registry.outputs.skip == 'false'
        env:
          AGENTKEEL_IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          AGENTKEEL_BUNDLE="agents/$NAME" uv run python -m infra.construct.app
          aws cloudformation deploy \
            --stack-name agentkeel-"$NAME" \
            --template-file "infra/construct/cdk.out/AgentkeelAgent.template.json" \
            --capabilities CAPABILITY_NAMED_IAM \
            --role-arn "arn:aws:iam::$(aws sts get-caller-identity --query Account --output text):role/agentkeel-cfn-exec" \
            --no-fail-on-empty-changeset

      - name: Load the agent's own table
        if: steps.registry.outputs.skip == 'false'
        run: >-
          uv run python scripts/load_rights_table.py --table "agentkeel-$NAME-rights"
          --rights "agents/$NAME/data/table.json" --marker "/agentkeel/marker/$NAME/rights-table-digest"

      # Item 4 (R7): the deployed agent, asked its own goldens in its runtime, scored by build.
      - name: The agent answers its own goldens
        if: steps.registry.outputs.skip == 'false'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          arn=$(aws cloudformation describe-stacks --stack-name agentkeel-"$NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='RuntimeArn'].OutputValue" --output text)
          AGENTKEEL_RUNTIME_ARN="$arn" uv run python -m src.agent.run --bundle "agents/$NAME" --commit "$COMMIT" \
            --goldens "agents/$NAME/goldens" --out "$RUNNER_TEMP/answer-raw.json" || true
          uv run python -m src.verdict.build answer --raw "$RUNNER_TEMP/answer-raw.json" --agent-dir "agents/$NAME" \
            --repository "$REPOSITORY" --run-url "$RUN_URL" --out "$RUNNER_TEMP/answer.json"
          echo "deployed $arn; $(uv run python -c 'import json,sys; print(json.load(open(sys.argv[1]))["verdict"])' "$RUNNER_TEMP/answer.json")" >> "$GITHUB_STEP_SUMMARY"

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: steps.registry.outputs.skip == 'false'
        with:
          role-to-assume: ${{ vars.AWS_ANSWER_PUT_ROLE_ARN }}
          role-session-name: agentkeel-answer-put-${{ github.run_id }}
          role-duration-seconds: 900
          aws-region: us-west-2
          unset-current-credentials: true

      # M07 PR 2 (SPEC/07 section 2 "Retired", section 6; rulings/pr2-security.md item 11): the signed archive
      # this job verified and deployed, put once under bundles/<name>/<commit>.tar with its signature beside
      # it, because the Actions artifact expires after 30 days and a retired agent's bundle must still be
      # there. Before the answer record, so a deploy whose bundle could not be kept writes no row and is
      # asked again. A 412 is an object of that key already put by an earlier run: it stands. Nothing here
      # reads its bytes back (no role of this job may get an object), so "the same bytes" is not claimed.
      - name: Put the signed bundle in the security account, once
        if: steps.registry.outputs.skip == 'false'
        run: |
          set -uo pipefail
          for pair in "dist/bundle.tar:tar" "bundle.cosign.json:cosign.json"; do
            file="$RUNNER_TEMP/signed/agents/$NAME/${pair%%:*}"
            key="bundles/$NAME/$COMMIT.${pair##*:}"
            if out=$(aws s3api put-object --bucket agentkeel-audit-897698239547 --key "$key" --body "$file" \
                --if-none-match '*' --checksum-algorithm SHA256 2>&1); then
              echo "put $key"
            elif echo "$out" | grep -q "PreconditionFailed"; then
              echo "$key was already put; it stands" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "$out"
              exit 1
            fi
          done

      # Once: the bucket refuses a put under envelopes/ without If-None-Match (infra/security/). A 412 is a
      # record already put by an earlier run whose registry write failed; the run goes on to the row
      # (second cold read, F2 on M06 PR 2). The first record stands; this run's answer is in its summary.
      # M07 PR 2 (re-read of 52ebd57): the step says which it was, and the registry row then says the
      # record standing is an earlier run's, not this run's.
      - name: Put the answer record in the security account, once
        id: answer
        if: steps.registry.outputs.skip == 'false'
        run: |
          set -uo pipefail
          if out=$(aws s3api put-object --bucket agentkeel-audit-897698239547 \
            --key "envelopes/agents/$NAME/$COMMIT.json" --body "$RUNNER_TEMP/answer.json" --if-none-match '*' 2>&1); then
            echo "put=first" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if echo "$out" | grep -q "PreconditionFailed"; then
            echo "envelopes/agents/$NAME/$COMMIT.json was already put; the first record stands" >> "$GITHUB_STEP_SUMMARY"
            echo "put=stood" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$out"
          exit 1

      # The registry row last, as the deploy role again: a put that failed leaves the commit undeployed in the
      # registry, so the next run asks again (cold review F8 on M06 PR 2).
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: steps.registry.outputs.skip == 'false'
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: agentkeel-deploy-agent-row-${{ github.run_id }}
          role-duration-seconds: 900
          aws-region: us-west-2
          unset-current-credentials: true

      - name: The agent's row in the registry
        if: steps.registry.outputs.skip == 'false'
        env:
          RUN_ID: ${{ github.run_id }}
          ANSWER_PUT: ${{ steps.answer.outputs.put }}
        run: >-
          uv run python scripts/registry.py write --name "$NAME" --repository "$REPOSITORY"
          --repository-id "$REPOSITORY_ID" --commit "$COMMIT" --run-id "$RUN_ID" --answer-put "$ANSWER_PUT"

  # --- M07 PR 2: a retirement (SPEC/07 section 6; rulings/pr2-security.md items 4 and 11) -----

  # No secret. On a dispatch that names an agent, that agent's retirement; on the schedule, each agent
  # whose pin is 30 days or fewer from its deprecated_after. The agent's manifest is read through GitHub's
  # API, as data. The name comes through the environment and is held to the agent name pattern.
  retire-plan:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.retire != '')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      any: ${{ steps.plan.outputs.any }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Install
        run: uv sync --frozen

      - name: Which retirement to open
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RETIRE: ${{ inputs.retire }}
        run: |
          set -euo pipefail
          if [ -n "$RETIRE" ]; then
            uv run python scripts/retire_agent.py plan --name "$RETIRE" --out "$RUNNER_TEMP/retire-plan.json"
          else
            uv run python scripts/retire_agent.py plan --deprecating --out "$RUNNER_TEMP/retire-plan.json"
          fi
          any=$(python3 -c 'import json, sys; print("true" if any(e.get("open") for e in json.load(open(sys.argv[1]))) else "false")' "$RUNNER_TEMP/retire-plan.json")
          echo "any=$any" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: retire-plan
          path: ${{ runner.temp }}/retire-plan.json
          if-no-files-found: error
          retention-days: 30

  # The key of the App that opens pull requests, in its own environment (main only). agentkeel's code,
  # on the artifact above: the grant read back first, the plan checked again, then one draft.
  retire-open:
    needs: retire-plan
    if: needs.retire-plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: platform-upgrades
    permissions:
      contents: read
      actions: read # the environment's own rules, read back
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Install
        run: uv sync --frozen

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: retire-plan
          path: ${{ runner.temp }}/plan

      - name: The App's grant and its key's environment, read back against the ruling
        env:
          AGENTKEEL_APP_PRIVATE_KEY: ${{ secrets.UPGRADES_APP_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run python scripts/platform_check.py grant --app agentkeel-upgrades --out "$RUNNER_TEMP/grant.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: grant-agentkeel-upgrades
          path: ${{ runner.temp }}/grant.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Open the draft retirement, as the App
        env:
          AGENTKEEL_APP_PRIVATE_KEY: ${{ secrets.UPGRADES_APP_PRIVATE_KEY }}
        run: uv run python scripts/retire_agent.py open --plan "$RUNNER_TEMP/plan/retire-plan.json"

  # The deploy role, from main: a merged head the App passed that says rollout: retired. The stack is
  # updated to the construct's template without the runtime. No job here signs, builds or deploys an image.
  retire-agent:
    needs: find-agents
    if: needs.find-agents.outputs.retiring != '[]' && needs.find-agents.outputs.retiring != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # OIDC to AWS, as the deploy role, then as the answer put role, then the deploy role again
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.find-agents.outputs.retiring) }}
    env:
      NAME: ${{ matrix.name }}
      REPOSITORY: ${{ matrix.repository }}
      REPOSITORY_ID: ${{ matrix.repository_id }}
      COMMIT: ${{ matrix.commit }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.commit }}
          path: agent-src
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Install
        run: uv sync --frozen

      # Again, at the commit being retired, with agentkeel's code: the App passed it, and it says retired.
      - name: The head is still what the platform check passed, and it says rollout retired
        run: |
          set -euo pipefail
          test "$NAME" != "refagent"
          uv run python -m src.validate.agent evaluate --agent agent-src --repository "$REPOSITORY" \
            --head "$COMMIT" --defer-seat-access --out "$RUNNER_TEMP/check.json"
          uv run python -c 'import sys, yaml; sys.exit(0 if yaml.safe_load(open("agent-src/manifest.yaml", encoding="utf-8")).get("rollout") == "retired" else "manifest.yaml does not say rollout: retired")'

      - name: Place the agent at agents/<name>, without its git or workflow files
        run: |
          set -euo pipefail
          mkdir -p "agents/$NAME"
          rsync -a --exclude .git --exclude .github agent-src/ "agents/$NAME/"
          rm -rf agent-src

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: agentkeel-retire-agent-${{ github.run_id }}
          role-duration-seconds: 3600
          aws-region: us-west-2

      # M07 PR 3 (rulings/pr2-security.md item 13i; platform-architect F4, security-reviewer 17 on M07 PR 2):
      # the stack below is updated from this head's manifest, and nobody signed this head. The commit the
      # registry row holds was signed, verified and deployed. So this head's manifest must be that commit's
      # in every field but rollout. A head that moves another field, or an agent whose row holds no deployed
      # commit, is refused here, before the registry or the stack is touched. The cost: a head that failed
      # to deploy before it was retired cannot be retired until it is fixed. The deployed manifest is read
      # from GitHub's API, as data, with the job's own token.
      - name: The retired head's manifest is the deployed one's, but for rollout
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          uv run python scripts/retire_agent.py same --name "$NAME" --repository "$REPOSITORY"
          --repository-id "$REPOSITORY_ID" --retired "agents/$NAME/manifest.yaml"

      # The ARN is kept on the registry row before anything is removed, so the one invocation after the
      # deletion, and a rerun of a retirement that failed halfway, still know which ARN to ask. Exit 4 is
      # "already retired"; 3 is another repository's agent, refagent, or no ARN known: refused.
      - name: Keep the runtime's ARN, before it is removed
        id: arn
        run: |
          set -uo pipefail
          from_stack=$(aws cloudformation describe-stacks --stack-name agentkeel-"$NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='RuntimeArn'].OutputValue" --output text 2>/dev/null || true)
          [ "$from_stack" = "None" ] && from_stack=""
          arn=$(uv run python scripts/registry.py retiring --name "$NAME" --repository-id "$REPOSITORY_ID" --arn "$from_stack")
          code=$?
          if [ "$code" = "4" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ "$code" = "0" ] || exit "$code"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "arn=$arn" >> "$GITHUB_OUTPUT"

      # The retirement: the same stack, synthesised from a manifest that says retired, has no runtime. The
      # update removes it as the execution role, which may already delete a template agent's runtime.
      - name: Update agentkeel-<name> to the stack without its runtime
        if: steps.arn.outputs.skip == 'false'
        run: |
          set -euo pipefail
          AGENTKEEL_BUNDLE="agents/$NAME" uv run python -m infra.construct.app
          if grep -q '"AWS::BedrockAgentCore::Runtime"' infra/construct/cdk.out/AgentkeelAgent.template.json; then
            echo "::error::the synthesised stack still has a runtime; nothing is deployed"
            exit 1
          fi
          aws cloudformation deploy \
            --stack-name agentkeel-"$NAME" \
            --template-file "infra/construct/cdk.out/AgentkeelAgent.template.json" \
            --capabilities CAPABILITY_NAMED_IAM \
            --role-arn "arn:aws:iam::$(aws sts get-caller-identity --query Account --output text):role/agentkeel-cfn-exec" \
            --no-fail-on-empty-changeset

      # One call, after the deletion, written raw. Only ResourceNotFoundException says the runtime is gone.
      # Anything else, an answer included, fails the job here: nothing is put in the audit bucket, the row
      # gets no retired_at, and the next run asks again with the ARN the row kept. CloudFormation deletes a
      # removed resource after the update has succeeded, so an update that exited 0 does not say the
      # runtime is gone (platform-architect B1 on M07 PR 2). What was returned is kept with the run.
      - name: One invocation of the retired runtime; anything but ResourceNotFoundException stops here
        id: invocation
        if: steps.arn.outputs.skip == 'false'
        env:
          ARN: ${{ steps.arn.outputs.arn }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          uv run python scripts/retire_agent.py invoke --arn "$ARN" --out "$RUNNER_TEMP/invocation.json"
          code=$?
          cat "$RUNNER_TEMP/invocation.json" >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" != "0" ]; then
            echo "::error::the runtime of $NAME is not gone: no retirement is recorded, and the registry row stays open"
            exit 1
          fi
          set -e
          uv run python scripts/retire_agent.py record --name "$NAME" --repository "$REPOSITORY" --commit "$COMMIT" \
            --arn "$ARN" --run-url "$RUN_URL" --invocation "$RUNNER_TEMP/invocation.json" --out "$RUNNER_TEMP/retired.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.arn.outputs.skip == 'false'
        with:
          name: retire-invocation-${{ matrix.name }}
          path: ${{ runner.temp }}/invocation.json
          if-no-files-found: ignore
          retention-days: 90

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: steps.arn.outputs.skip == 'false'
        with:
          role-to-assume: ${{ vars.AWS_ANSWER_PUT_ROLE_ARN }}
          role-session-name: agentkeel-retired-put-${{ github.run_id }}
          role-duration-seconds: 900
          aws-region: us-west-2
          unset-current-credentials: true

      # Once, in the security account: the registry row is in the agent account and is not write-once.
      - name: Put the retirement in the security account, once
        if: steps.arn.outputs.skip == 'false'
        run: |
          set -uo pipefail
          out=$(aws s3api put-object --bucket agentkeel-audit-897698239547 \
            --key "envelopes/agents/$NAME/retired.json" --body "$RUNNER_TEMP/retired.json" --if-none-match '*' 2>&1) && exit 0
          if echo "$out" | grep -q "PreconditionFailed"; then
            echo "envelopes/agents/$NAME/retired.json was already put; the first record stands" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "$out"
          exit 1

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: steps.arn.outputs.skip == 'false'
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: agentkeel-retire-agent-row-${{ github.run_id }}
          role-duration-seconds: 900
          aws-region: us-west-2
          unset-current-credentials: true

      # Last: a put that failed leaves the row without retired_at, so the next run finishes the retirement.
      - name: retired_at on the agent's row, which stays
        if: steps.arn.outputs.skip == 'false'
        env:
          RUN_ID: ${{ github.run_id }}
        run: >-
          uv run python scripts/registry.py retire --name "$NAME" --repository-id "$REPOSITORY_ID"
          --commit "$COMMIT" --run-id "$RUN_ID"
