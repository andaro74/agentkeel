# evals (SPEC/00 §5 `regression` and `cost-cap`, P11). Security seat.
# Authorised by SPEC/00-overview.md#8-M00 and the ruling on report 2.3;
# changed at M01 PR 1 by SPEC/00-overview.md#8-M01 and
# milestones/M01/rulings/pr1.md (items 9 and 16). Its hash is listed in
# infra/workflows.sha256, which `make validate` reads (item 29).
#
# Runs `make evals` with the role in infra/eval-role/ and writes the
# envelope to evals/history/<commit>.json with a commit from this workflow.
# That commit is what "CI-written" means (ADR-0003); a human commit to
# evals/history/ needs two keys.
#
# Two jobs. The job that runs the PR's code, and whatever `uv sync` pulls
# in, has no write token. The job with the write token runs git only. It
# still commits bytes the first job produced, so "CI-written" means who
# pushed the file, not what wrote it: a PR that edits src/verdict/ or the
# Makefile decides what its own envelope says. Known gap until the reader
# can be taken from main.
#
# A commit pushed with GITHUB_TOKEN starts a run of each workflow, which
# GitHub parks at action_required with no jobs; so the envelope commit has
# no check runs of its own, and the next human push is what
# cold-review-ruling reads. That next push does not spend again: the
# first step finds the envelope whose commit differs from HEAD only in
# prose and history. It then asks verdict.gate to rule on that envelope,
# and the gate's exit code is the job's. A RED envelope stays RED.
#
# checks.F0_3 is read from GitHub, not from the tree. If the ruleset on
# main changes, a prose-only push does not measure again; change a
# measured path, such as milestones/M00/runs/f0_3.yaml.
#
# A run with no agent under test (M01 PR 1) writes the control's envelope,
# in M00's form (ADR-0004 amendment 2); it is gated and recorded like any
# other.
#
# From M01 PR 2 the run also carries claim 1's checks (SPEC/01 §4):
# F1_1 from the S1, S2, S3 and S8 tests and the CloudTrail lookup of S4's
# request ids; F1_2 from the S5 test; F1_3 from the CloudTrail lookup of
# S6's request id; F1_4 from the envelope's own goldens. A falsifier read
# from two sources passes only if both do. The attempts are the human's,
# made before this run; what this run reads is AWS's record of them
# (`scripts/observe_attempt.py`, ruling i).
#
# What this does not do:
# - stop someone with write access from editing this file, or from adding
#   a workflow that assumes the same role. `validate` fails on a workflow
#   whose hash is not in infra/workflows.sha256, and a PR can edit both.
#   Nothing gates that until M02.
# - tell a hand-written evals/history/<commit>.json from a recorded one,
#   beyond what verdict.gate checks. `two-key` on a human commit there is M02.
# - record on `push` to main. It measures and gates only.
name: evals

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: evals-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  # BLOCK C / B2 (M01 PR 2's cold review, repaired here). `evals` below skips
  # on a fork, because a fork gets no OIDC token and cannot measure. GitHub
  # counts a **skipped required check as satisfied**, so while `evals` was the
  # only required context a fork PR could merge with no `make validate` and no
  # pytest at all.
  #
  # This job is the half that needs no credentials, and it carries no `if:`:
  # it runs for every pull request, a fork's included, and it fails the PR
  # when `validate` or pytest fails. `infra/ruleset/main.json` requires this
  # context too — splitting the job without re-exporting the ruleset would
  # have left the hole exactly where it was, because the required context
  # would still have been the one a fork skips.
  #
  # pytest runs here **and** in `evals`, on purpose. The copy in `evals`
  # carries `continue-on-error: true` so a failure reaches the envelope as
  # `checks.F0_2 = fail` (SPEC/01 §4); this copy must fail the job instead.
  # The two answer different questions, so neither can be dropped for the
  # other, and about 40 seconds is the price.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Install
        run: uv sync --frozen

      - name: make validate
        run: make validate

      # Same reason as in `evals`: without cosign the signature check never
      # runs and S1/S2 are refused for the other half of their reasons.
      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2

      - name: pytest
        run: uv run pytest -q

  evals:
    # A fork gets no OIDC token. Skip it; do not fail it. The `checks` job
    # above is what a fork PR cannot skip.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # OIDC to AWS
      checks: read # the F0.3 observer reads one check run
      pull-requests: read
    env:
      COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    outputs:
      envelope: ${{ steps.written.outputs.envelope }}
      gate_exit: ${{ steps.gate.outputs.gate_exit }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Is this tree already measured?
        id: current
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$COMMIT"
          for f in evals/history/*.json; do
            [ -f "$f" ] || continue
            sha=$(basename "$f" .json)
            case "$sha" in *[!0-9a-f]*) continue ;; esac
            [ "${#sha}" -eq 40 ] || continue
            git merge-base --is-ancestor "$sha" HEAD || continue
            # Prose, the ledger, subagent prompts and history do not change
            # what the tree measures.
            if git diff --quiet "$sha" HEAD -- . \
              ':(exclude)evals/history' ':(exclude)docs' ':(exclude)SPEC' ':(exclude).claude' \
              ':(exclude,glob)milestones/**/*.md' \
              ':(exclude)README.md' ':(exclude)CLAUDE.md' ':(exclude)LICENSE'; then
              echo "::notice::measured at $sha; nothing measured has changed since. Not spending again; the gate rules on that envelope."
              echo "measured_at=$sha" >> "$GITHUB_OUTPUT"
              break
            fi
          done

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Install
        run: uv sync --frozen

      # The skip path. No AWS, no spend. The gate decides, not this file.
      - name: Gate the recorded envelope
        if: steps.current.outputs.measured_at != ''
        env:
          MEASURED_AT: ${{ steps.current.outputs.measured_at }}
        run: uv run python -m src.verdict.gate "evals/history/$MEASURED_AT.json"

      - name: make validate
        if: steps.current.outputs.measured_at == ''
        run: make validate

      # `src/bundle/verify.py` skips the cosign check when cosign is not on
      # the machine, and says so. Without this step S1 and S2 would still be
      # refused — for the missing signature and for the digest — but the
      # signature check itself would never run in the run that measures
      # them. It is installed before pytest for that reason (M01 PR 2).
      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
        if: steps.current.outputs.measured_at == ''

      # A failing test must reach the envelope as checks.F0_2 = fail, so the
      # job goes on and fails at the end.
      - name: pytest
        id: pytest
        if: steps.current.outputs.measured_at == ''
        continue-on-error: true
        run: uv run pytest --junitxml="$RUNNER_TEMP/junit.xml"

      - name: Observe the F0.3 plant
        if: steps.current.outputs.measured_at == ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run python scripts/observe_pr_check.py milestones/M00/runs/f0_3.yaml --out "$RUNNER_TEMP/f0_3.json"

      # The three claims the role's trust policy matches on: `aud` and `sub`
      # exactly, `job_workflow_ref` by pattern. When an assume is refused, look
      # here first: the first deploy trusted a `sub` this repo never issues
      # (feasibility.md §9.5). Prints the claims, never the token. A diagnostic:
      # if it fails, the measurement goes on.
      - name: OIDC claims the role trusts
        if: steps.current.outputs.measured_at == ''
        continue-on-error: true
        run: |
          set -euo pipefail
          curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | python3 -c 'import base64, json, sys; p = json.load(sys.stdin)["value"].split(".")[1]; c = json.loads(base64.urlsafe_b64decode(p + "=" * (-len(p) % 4))); [print(k, "=", c.get(k)) for k in ("aud", "sub", "job_workflow_ref")]'

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: steps.current.outputs.measured_at == ''
        with:
          role-to-assume: ${{ vars.AWS_EVAL_ROLE_ARN }}
          role-session-name: agentkeel-evals-${{ github.run_id }}
          role-duration-seconds: 900
          aws-region: us-west-2

      # Item 18: one refused call on a denied action, and one through an
      # unpinned profile. Neither has a seeded case (SPEC/01 §9), so this is
      # a recorded probe, not a check: it prints what AWS said and does not
      # decide the row. If either call succeeded, the Deny statement or the
      # profile condition is not doing what infra/bootstrap says it does.
      - name: The eval role refuses what it is denied
        if: steps.current.outputs.measured_at == ''
        continue-on-error: true
        run: |
          set -uo pipefail
          echo "### The eval role's refusals (item 18)" >> "$GITHUB_STEP_SUMMARY"
          for call in "iam list-roles --max-items 1" "bedrock-runtime converse --model-id anthropic.claude-sonnet-5 --messages '[{\"role\":\"user\",\"content\":[{\"text\":\"hi\"}]}]'"; do
            out=$(eval "aws $call" 2>&1) && verdict="SUCCEEDED (expected AccessDenied)" || verdict="refused"
            printf -- '- `aws %s`: %s\n' "$call" "$verdict" >> "$GITHUB_STEP_SUMMARY"
            printf -- '  ```\n  %s\n  ```\n' "$(printf '%s' "$out" | head -c 400)" >> "$GITHUB_STEP_SUMMARY"
          done

      # Seeds S4 and S6 (ruling i). The human made the attempts; CloudTrail
      # is asked whether each request id was refused. An attempt not yet made
      # writes an observation that says so, and the check fails.
      - name: Look up S4's and S6's request ids in CloudTrail
        if: steps.current.outputs.measured_at == ''
        run: |
          set -euo pipefail
          uv run python scripts/observe_attempt.py milestones/M01/runs/f1_1_laptop.yaml --out "$RUNNER_TEMP/s4.json"
          uv run python scripts/observe_attempt.py milestones/M01/runs/f1_3_key_policy.yaml --out "$RUNNER_TEMP/s6.json"

      # ADR-0007, P1 (Option B). refagent is measured in the deployed runtime
      # only when the runtime runs this tree's bytes: the bundle digest this
      # tree packs to is among the tags of the image the runtime pins. Then
      # `make evals` gets the runtime's ARN, and the envelope says `mode:
      # runtime`. Otherwise it gets none, the run measures in the runner, and
      # the envelope says `mode: runner`. The script never fails the job, and
      # it writes its reason to the summary, because the envelope has no field
      # for why (the condition on P1). Read-only: DescribeStacks on
      # agentkeel-refagent, GetAgentRuntime, ecr:DescribeImages (bootstrap).
      - name: Which runtime runs this tree's bytes
        id: runtime
        if: steps.current.outputs.measured_at == ''
        run: uv run python scripts/runtime_for_tree.py --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"

      # `shell: bash` is load-bearing, not style. GitHub's default for a
      # `run:` is `bash -e {0}`, which does NOT set pipefail; only an
      # explicit `shell: bash` adds `-o pipefail`. Without it the `| tee`
      # below makes the step's exit status tee's, which is always 0, and
      # `make evals` exiting non-zero on a RED or REJECTED gate is swallowed.
      # That was the job's only way to fail on the gate's verdict when this
      # path runs (`evals` is a required check, infra/ruleset/main.json). So
      # between 442484f and its repair a RED envelope **would have** reported
      # a green required check. No RED run occurred in that window: the
      # protection was gone, the results were not wrong.
      #
      # Neither this step nor its job may carry `continue-on-error`, and the
      # command may not end in `|| true`: each restores the hole with
      # `shell: bash` still set. tests/test_evals_workflow.py injects all
      # four and fails on each.
      #
      #   $ bash -ec 'false | tee /dev/null'; echo $?
      #   0
      #   $ bash -eo pipefail -c 'false | tee /dev/null'; echo $?
      #   1
      #
      # tests/test_evals_workflow.py holds this and the record job's guard.
      - name: make evals
        if: steps.current.outputs.measured_at == ''
        shell: bash
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Empty unless the step above matched the bytes: empty is runner mode.
          AGENTKEEL_RUNTIME_ARN: ${{ steps.runtime.outputs.arn }}
        run: make evals F0_2_JUNIT="$RUNNER_TEMP/junit.xml" F0_3_OBS="$RUNNER_TEMP/f0_3.json" S4_OBS="$RUNNER_TEMP/s4.json" S6_OBS="$RUNNER_TEMP/s6.json" JUNIT="$RUNNER_TEMP/junit.xml" RUN_URL="$RUN_URL" GATE_EXIT="$RUNNER_TEMP/gate_exit" 2>&1 | tee "$RUNNER_TEMP/evals.out"

      # Which refagent answered, as the runner printed it. From ADR-0007 the
      # envelope records the mode itself (`mode`, `runtime_arn`); this line is
      # for the reader of the run, on every measuring run, not only on main.
      - name: Which refagent answered
        if: always() && steps.current.outputs.measured_at == ''
        run: |
          mode=$(grep -m 1 '^mode: ' "$RUNNER_TEMP/evals.out" || echo "mode: not reported")
          echo "### $mode" >> "$GITHUB_STEP_SUMMARY"
          if [ "${mode#mode: runner}" != "$mode" ]; then
            echo "Measured in the runner, not as the construct's tenant. Construct tenancy is read by" \
              "the first run whose bytes match the deployed runtime (ADR-0007): M01 PR 4's." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      # The gate's own exit code: 0 GREEN, 1 RED or UNMEASURED, 2 REJECTED.
      # A REJECTED envelope is not evidence and is not recorded (M01 item 9);
      # this run's URL and its step summary are the record of the rejection.
      # The file is written by `make evals`, which is the PR's own code, so a
      # PR that edits the gate or the Makefile decides this too; the same gap
      # as the header's. Not yet fired on a seeded REJECTED run in CI.
      - name: The gate's exit
        id: gate
        if: always() && steps.current.outputs.measured_at == ''
        run: |
          if [ -f "$RUNNER_TEMP/gate_exit" ]; then
            code=$(tr -dc '0-9' < "$RUNNER_TEMP/gate_exit")
            echo "gate_exit=$code" >> "$GITHUB_OUTPUT"
            if [ "$code" = "2" ]; then
              echo "**REJECTED** by verdict.gate (exit 2). Not recorded in evals/history/; this run is the record." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: The envelope
        id: written
        if: always() && steps.current.outputs.measured_at == ''
        run: |
          if [ -f "evals/history/$COMMIT.json" ]; then
            echo "envelope=true" >> "$GITHUB_OUTPUT"
            { echo '```json'; cat "evals/history/$COMMIT.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.written.outputs.envelope == 'true'
        with:
          name: history-${{ env.COMMIT }}
          path: evals/history/${{ env.COMMIT }}.*
          if-no-files-found: error
          retention-days: 90

      # When build REFUSES, no envelope is written and the artifact above does
      # not run, so the raw observations — the only place a failed call's own
      # error text lives — are lost with the runner. This keeps them.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.current.outputs.measured_at == '' && steps.written.outputs.envelope != 'true'
        with:
          name: raw-${{ env.COMMIT }}
          path: evals/history/${{ env.COMMIT }}.*raw.json
          if-no-files-found: warn
          retention-days: 30

      - name: Fail if pytest failed
        if: steps.pytest.outcome == 'failure'
        run: exit 1

  # Writes evals/history/. Runs git and nothing else: no `make`, no `uv`,
  # no code from the PR. A RED envelope is recorded too; a REJECTED one
  # (gate exit 2) is not.
  record:
    needs: evals
    if: >-
      always() && github.event_name == 'pull_request'
      && needs.evals.outputs.envelope == 'true'
      && (needs.evals.outputs.gate_exit == '0' || needs.evals.outputs.gate_exit == '1')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      COMMIT: ${{ github.event.pull_request.head.sha }}
      BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: history-${{ env.COMMIT }}
          path: ${{ runner.temp }}/history

      - name: Commit evals/history/<commit>.*
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "$COMMIT" ]; then
            echo "::warning::$BRANCH moved past $COMMIT; this run's envelope is not recorded"
            exit 0
          fi
          mkdir -p evals/history
          for name in "$COMMIT.json" "$COMMIT.baseline-card.json" "$COMMIT.baseline-raw.json"; do
            cp "$RUNNER_TEMP/history/$name" "evals/history/$name"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "evals/history/$COMMIT.json" "evals/history/$COMMIT.baseline-card.json" "evals/history/$COMMIT.baseline-raw.json"
          git commit -m "evals: CI-written envelope for $COMMIT" -m "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          git push origin "HEAD:refs/heads/$BRANCH"
