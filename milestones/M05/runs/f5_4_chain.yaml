# Seed S4 (SPEC/05 §5, F5.1 and F5.2): a call chain at depth 3, sent to
# refagent's deployed runtime.
#
# Planted at M05 PR 1 as the attempt to make, `observed: null`, beside the
# code seed tests/fixtures/m05/s4-depth3-request.json, whose payload it
# sends. Made by the human after M05 PR 2 merges and `deploy.yml` has
# deployed the runtime image with the chain check (SPEC/05 §5.1, the named
# P3 exception): recorded by PR 3's run.
#
# The chain is the `chain` list in the invocation's JSON payload: the
# agents that called before refagent. Two names, so refagent is the third
# agent, and its manifest's ceilings.depth is 2. The chain is asserted by
# the caller until Identity carries it (M07; SPEC/05 §5): this measures that
# a chain refagent is told is too deep is refused and recorded, not that a
# caller cannot lie about its depth.
#
# Self-reported (SPEC/05 §2, finding 9): the trail's record of the
# InvokeAgentRuntime call is the agent's to neither write nor change; that
# the call was refused rests on the agent's refusal event under its own
# prefix and on no model call by its role in the same minute. The
# attempt's time is the trail record's eventTime.
#
# Each observed entry: what, event_name, session_id (the --runtime-session-id
# passed, 33 characters or more), at (not read as the attempt's time), result
# (the runtime's answer, verbatim). Amended at M05 PR 2, before the attempt:
# the call is found in the trail by its session id, which the trail records
# and the runtime is handed, not by a request id the CLI does not print.
# Corrected at M05 PR 3, on its first run and the audit bucket's record: the
# trail records the session id only in `responseElements`, and a call the
# runtime refused has none. S4's record (02:07:06Z, RuntimeClientError,
# request 342eefbc-499f-4983-8dbf-78878a941d15) carries no session id; the
# observer finds it as the one invocation by the caller within two minutes
# of `at`. The runtime was handed the id: the refusal event is keyed by it.
seed: S4
falsifiers: [F5.1, F5.2]
principal: the human, with InvokeAgentRuntime on refagent's runtime
attempts:
  - what: invoke refagent's runtime with a chain of two callers before it
    event_name: InvokeAgentRuntime
    command: aws bedrock-agentcore invoke-agent-runtime --agent-runtime-arn <refagent runtime> --runtime-session-id <session id> --payload fileb://tests/fixtures/m05/s4-depth3-request.json out.json
    refused_when: the answer is a refusal naming the depth, and the agent role made no model call for it
    recorded_when: the trail's InvokeAgentRuntime record and refagent's refusal event, each an object in the audit bucket within N of the call's eventTime
observed:
  # Made 2026-09-30 by the human (hector.acevedo, admin), after M05 PR 2's merge deploy (run 36657429406; runtime
  # version 6, AGENTKEEL_CEILING_DEPTH 2). AgentCore passes the container's 403 to the caller as a
  # RuntimeClientError and drops its body, so the caller never sees the refusal's `recorded` field; no out file
  # was written. refagent's log (stream 9d4cae76-af77-4b5c-b379-6e2f7213a3ed) has "POST /invocations HTTP/1.1"
  # 403 at 02:07:06.801Z and no other invocation near it; the agent account's event history has no Converse by any
  # principal from 02:00Z (read 2026-09-30). Whether the refusal event reached the audit bucket is PR 3's run's
  # reading (Unsure F with it).
  - what: invoke refagent's runtime with a chain of two callers before it
    event_name: InvokeAgentRuntime
    session_id: m05-s4-20260930T020652Z-863984448da3
    at: '2026-09-30T02:06:56Z'
    result: 'An error occurred (RuntimeClientError) when calling the InvokeAgentRuntime operation: Received error (403) from runtime. Please check your CloudWatch logs for more information.'
    runtime_log: '"POST /invocations HTTP/1.1" 403 at 2026-09-30T02:07:06.801Z'
