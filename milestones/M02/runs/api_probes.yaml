# The GitHub API calls Security's M02 PR 2 rulings rest on (milestones/M02/
# README.md "For the seats"; PR #11 Unsure C and H), made on 2026-09-22 from
# the human's machine by the session, each recorded with the command that
# re-makes it. "Read by the call, not from memory or the spec" (the
# security-reviewer report on PR 1, §8). Not an envelope; rules nothing.
#
# What is still unread, and where it is read: whether a workflow's
# GITHUB_TOKEN (`permissions: contents: read`) is shown `bypass_actors` on
# the ruleset. The unauthenticated answer below omits the field, so the
# question is what an Actions token counts as. It is read on PR 2's first
# `checks` run: `make validate`'s "live main ruleset" line is green only if
# the field was shown. If it is not, validate says "not shown to this
# caller" and the compare needs a token that is (Unsure H, Security).
probes:
  - what: the main ruleset, unauthenticated
    command: "curl -s -H 'Accept: application/vnd.github+json' https://api.github.com/repos/andaro74/agentkeel/rulesets/23685206"
    status: 200
    read: enforcement active, 4 rules; `bypass_actors` and `current_user_can_bypass` ABSENT from the answer
    consequence: an unauthenticated read cannot compare bypass_actors; validate treats an absent list as unreadable, never as "nobody bypasses"
  - what: the main ruleset, with the human's gh token (scopes gist, read:org, repo, workflow)
    command: gh api repos/andaro74/agentkeel/rulesets/23685206
    status: 200
    read: bypass_actors [], current_user_can_bypass never, updated_at 2026-09-20T20:19:07.471-07:00 (equal to infra/ruleset/main.json)
  - what: the rule-suites API, unauthenticated
    command: curl -s -o /dev/null -w '%{http_code}' 'https://api.github.com/repos/andaro74/agentkeel/rulesets/rule-suites?ref=main'
    status: 401
  - what: the rule-suites API, with the human's gh token
    command: gh api 'repos/andaro74/agentkeel/rulesets/rule-suites?ref=main&per_page=3'
    status: 200
    read: >-
      three evaluations, all result pass, actor_name andaro74, ref refs/heads/main: the merges of #9
      (616b620), #10 (ec0358d) and #11 (c77e872). Nothing yet says whether a refused `gh pr merge
      --admin` appears here with result fail; that is read at S4's attempt 1 (SPEC/02 §5.1).
    consequence: >-
      the endpoint needs a token GitHub can name with administration:read; a workflow's
      `permissions:` block cannot grant that key, so scripts/observe_pr.py takes RULE_SUITES_TOKEN
      when the environment has one, and records the status it got when it does not.
  - what: the main ruleset, from a workflow with GITHUB_TOKEN (permissions contents read), PR 12's first run
    command: make validate in evals.yml's checks and evals jobs, run 35809406890, 2026-09-23T02:12Z
    status: 200 with GITHUB_TOKEN
    read: "FAIL live main ruleset equals its export, bypass_actors []: the live ruleset's bypass_actors is not shown to this caller"
    consequence: >-
      the answer to Unsure A and H: an Actions token is not shown the bypass list. The compare reads
      with RULESET_TOKEN, a fine-grained token with Administration: read on this repository, kept as
      a repository secret by the human, fetched by a step of the evals job that runs no PR code and
      handed to validate as a file; the checks job carries no secret (a fork's PR runs it) and
      validate prints there that the compare is skipped (Security, pr2-security.md item 2). Both jobs
      were red on this line alone; no token was spent (validate runs before AWS). Unread: whether a
      fine-grained token with Metadata: read alone is shown the list; Administration: read is what
      the endpoints document, not what was measured as the minimum.
  - what: a job's log by job id, with the human's gh token
    command: gh api repos/andaro74/agentkeel/actions/jobs/106624547408/logs
    status: see rehearsal_seed_prs.json (log_status)
