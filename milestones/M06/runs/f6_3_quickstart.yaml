# Seed S3 (SPEC/06 §5, F6.1's live half and F6.3): the timed quickstart.
#
# Planted at M06 PR 1 as the attempt to make, `observed: null`. Not made
# at M06 (Product, 2026-10-01: milestones/M07/open.md row 4). Restated at
# M07 PR 4 (SPEC/07 §12, "the restatements R9 owes"): it is made once, at
# M07, after PR 3 merged (cba3aac) and after the owner's test deployed an
# agent from the template end to end (run 37077850271, 2026-10-02), and is
# read by M07 PR 4's run (scripts/observe_template.py; `build` rules on
# it; SPEC/07 §5 step 4). Act 1 is the unedited screen capture of this
# run (finding 14).
#
# The clock (SPEC/06 §1; finding 8; restated at M07 PR 4 as the reader
# has it): from the agent repository's `created_at` (the owner creates it
# from the template; finding 4) to the last of three timed records: the
# first pull request's merge, the platform's deploy run completed, and the
# answer record with one of the agent's own goldens passed. Two more are
# read and not timed, and F6.3 is unread without them: the registry row
# and panel 1's row. The first pull request's refusal is F6.1's. Every
# time is GitHub's or AWS's, never one written here. The bar is
# `quickstart.max_seconds` (28,800 s, wall clock, breaks not subtracted),
# in `thresholds.yaml` from PR 2.
#
# The human fills `observed` with the repository, the first pull request's
# number and the agent's name. PR 4's run looks each record up
# (`scripts/observe_template.py`); `build` rules on them. A human-written
# file feeds no reading by itself (SPEC/06 §4). A repository deleted during
# the attempt is recorded here, never replaced by a later one (finding 4).
# A second timing is a second attempt, recorded beside the first; the first
# is the measured value.
seed: S3
falsifiers: [F6.1, F6.3]
principal: floresinnovations (id 336113686), write on the agent repository only, on a fresh Windows user profile with no AWS credentials
# Preparation, before `created_at` and not timed (milestones/M06/feasibility.md
# section 2, NOTE 23): the account, created 2026-09-30T14:09:05Z on the fresh
# profile (GitHub's record); two-factor on, email private with command-line
# pushes that expose it blocked, no token, SSH key or authorised app (the
# human's word, 2026-09-30). Nothing else is prepared: not the template, the
# quickstart, a manifest or a golden. What is installed on the profile is
# listed and pushed before the run (open.md row 17).
agent_name: window-check  # fictional; named by Product on 2026-10-03, before the run (SPEC/07 §12)
attempts:
  - what: the quickstart end to end, as docs/developer/quickstart.md gives it
    command: create from the template (the owner) -> fill the manifest -> the first pull request, refused on an unassigned seat and on goldens under the minimum -> assign the seats and add the goldens -> merged -> deployed by the platform -> the agent answers one of its own goldens -> the registry and panel 1 list it
    refused_when: the first pull request is not mergeable while a seat is unassigned or the goldens are under the minimum (F6.1); it must carry the template's empty seats or empty goldens at its first commit, as the quickstart's step 3 says, or nothing was refused and F6.1's live half reads not held (cold review N2 on M06 PR 2)
    recorded_when: PR 4's run reads created_at and the last of the four records, and the difference is at most quickstart.max_seconds (F6.3)
# Made on 2026-10-03, once, as stated in milestones/M07/runs/pr4_expected.md
# (pushed 01:00:11Z; the repository created 01:01:33Z). The first pull
# request's first commit was refused for a YAML fault of the developer's
# own (a stray character), not for its seats and goldens; its second commit
# was refused for both; its third passed; merged by floresinnovations.
# GitHub's schedules were late and the owner dispatched the check three
# times and the deploy twice, from main (pr4_expected.md says which). The
# deploy that counted was a scheduled one, 37087860298. The observer reads the
# rest from GitHub, AWS and Grafana; `build` rules on it.
observed:
  - what: the quickstart end to end, as docs/developer/quickstart.md gives it
    repository: agentkeel-studio/window-check
    pull_request: 1
    agent_name: window-check
    at: '2026-10-03T02:01:44Z'
