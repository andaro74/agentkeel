#
# **The fallback, named here before any run.** If the swap's envelope is
# RED it is not merged; F4's reading is recorded; and the rollback is read
# on owner-check's platform upgrade (S1), merged and then reverted by a
# pull request in owner-check. With the fallback the model upgrade is not
# taken (`upgrade.taken` stays under 3, row 7 RED on it) and F7.3 is still
# read.
#
# Independent of the owner's test and the timed run (SPEC/07 §5.1): the
# swap may be attempted at any time after M07 PR 2 merges and the token
# model-watch opens pull requests with is granted (SPEC/07 §11, R3). The
# swap and its revert are pull requests on agentkeel's main outside M07's
# cap of four, by a line in the ledger. Each needs its Threshold Owner
# ruling file, which is not a person's edit (BLOCK 2).
#
# **If the revert does not go green** (security-reviewer 16 on M07 PR 1):
# the revert is itself a pin move the M04 gate rules, and the first main
# envelope after a merged swap may fail F4_4 (open.md row 58).
#
# **Named by the Threshold Owner on 2026-10-02, before the swap is opened**
# (milestones/M07/rulings/pr2-threshold-owner.md, item 3), and so before it
# is merged:
# - The revert is expected GREEN: it returns to Sonnet 4.6, whose envelopes
#   are the long history F4_4's median is read over.
# - The revert RED on F4_4 alone: one second run of the revert, stated
#   before in a run file and pushed first. The one exception to "a swap
#   never gets a second run".
# - The revert RED on a regressed golden, or RED twice: refagent stays on
#   Haiku 4.5, which the gate passed, until a pin pull request is GREEN.
#   That is the finding. F7.3 is then read on the fallback, owner-check's
#   platform upgrade reverted, and `upgrade.taken` stays under 3.
# No pin is moved by hand and no runtime is re-pointed by hand.
# The first `main` envelope after the merged swap is recorded as read,
# whatever F4_4 says (open.md row 58). The eval role keeps its access to the
# candidate after the revert: it has held it since M04 PR 2
# (infra/bootstrap, EVAL_CANDIDATES); refagent's runtime role loses it at
# the revert's deploy, since the construct builds it from the pin.
#
# **Which App** (Security, ruled 2026-10-02, rulings/pr2-security.md item
# 10): the pull request is opened by `agentkeel-upgrades`, not by
# `agentkeel-platform` (5144253), which is never installed on `andaro74`.
# "The App" in the attempts below is `agentkeel-upgrades`.
