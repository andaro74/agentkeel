# rolled back.
#
# Planted at M07 PR 1 as the attempts to make, `observed: null`. Today
# nothing opens a swap but a person (M04's two swap pull requests were
# opened by hand), and nothing compares the runtime's digest with the
# tree's after a merge to main, so a revert that left the swap's bytes
# live would be seen by nobody.
#
# The candidate, named here before any run (Threshold Owner, ruled
# 2026-10-01; milestones/M07/feasibility.md section 2, item 16):
# `pinned_roles.m04_cheaper_swap`, Haiku 4.5,
# anthropic.claude-haiku-4-5-20251001-v1:0. It has never been run against
# the goldens (milestones/M07/open.md row 66), so its envelope's verdict is
