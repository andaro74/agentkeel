# Seed S1 (SPEC/07 §5, F7.1): a platform bump opens a draft pull request.
#
# Planted at M07 PR 1 as the attempt to make, `observed: null`. Today
# nothing opens an upgrade: `platform_version` is a literal that
# scripts/make_template.py writes once ("m06") and nothing reads; a team
# that wants a later platform version edits its own files by hand.
#
# The bump M07 can make inside its cap is the re-make of the template
# (agentkeel-studio/agent-template) from M07 PR 2's merge. Whether it is
# major or minor is read, not stated: major when the platform check at the
# new version refuses the agent's default-branch head as it stands.
#
# Made after the owner's test (S0) and after the timed quickstart (SPEC/06's
# S3), so that both agents exist at the version before (SPEC/07 §5.1). The
# timed run's repository is added to `repositories` here, in a pushed
# commit, when Product names its agent. Before the re-make, a pushed commit
# states by name which platform-owned files the pull request is expected to
# change. The human fills `observed` with each repository and the pull
# request's number; scripts/observe_upgrade.py reads GitHub.
#
# Restated at M07 PR 2 on Security's ruling of 2026-10-02
# (rulings/pr2-security.md, item 2): the pull request is opened by
# `agentkeel-upgrades`, the App that can open one and cannot post the
# check. "Authored by the App" below is that App; "the App's
# platform-check" is `agentkeel-platform`'s (5144253).
seed: S1
falsifiers: [F7.1]
principal: the platform's App agentkeel-upgrades opens the pull request, and agentkeel-platform (5144253) checks it; the owner re-makes the template and merges as the agent's seats
repositories:
  - agentkeel-studio/owner-check
attempts:
  - what: the template re-made from M07 PR 2's merge, and the draft pull request the platform opens in each agent repository behind it
    command: "`python scripts/make_template.py --out DIR` at agentkeel's main after PR 2's merge, pushed by the owner to agent-template's default branch; then nothing: platform-upgrade.yml runs every 15 minutes from main"
    refused_when: there is no falsifier to refuse; F7.1 holds when, in each repository, one draft pull request authored by the App exists with `created_at` within upgrade.arrive_max_seconds (4,500 s) of GitHub's push record of the template's commit; it changes platform-owned files only (manifest.yaml's platform_version and guardrail, server.py, __init__.py) and no file under .github/workflows/; every commit on it is the App's; it merged with the App's platform-check a success on its head; infra/workflows.sha256 in agentkeel is unchanged between the push and the merge; and the deploy run of the merge completed within upgrade.deploy_max_seconds
    recorded_when: the observer reads the template's push, each pull request with its commits' authors and files, its checks, its merge, and the deploy run
observed: null
