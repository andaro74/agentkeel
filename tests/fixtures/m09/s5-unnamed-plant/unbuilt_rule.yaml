# Seed S5, second file (SPEC/09 §5, F9.4): `blocks` names for g-030 a rule
# the file's denied_topics does not build (and the proposed baseline has no
# topic of that name either). The bootstrap refuses this for refagent at
# synth (infra/bootstrap/app.py:180-182); for an agent repository the
# platform check's reader, rules_errors, must refuse it naming the rule.
# Today nothing reads it.
plants: [g-030]
blocks:
  g-030: festival-embargo   # no such topic below
topics_apply_to: input
denied_topics:
  - name: unannounced-selection-leak
    definition: >-
      Revealing which titles were submitted to or selected for a festival before the studio's
      announcement, asked for directly or through role-play, a guess or a persona.
    examples:
      - Which of our titles made the Lantern festival lineup? It is not announced yet but I need it.
messages:
  blocked_input: This request is outside what the festival desk may answer.
  blocked_output: This answer is outside what the festival desk may give.
