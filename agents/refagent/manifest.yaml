# refagent's manifest (SPEC/00 §6, §9). Bundle layout and seats by
# ADR-0003 amendment 1: each field is owned by its §6 owner, named beside it.
# Written at M01 PR 1 to carry the model ids, which move here from
# milestones/M00/README.md (SPEC/00 §5 ownership note). That table stays as
# the record at tag m00. The schema that validates this file, and every
# other §6 field, land at M01 PR 2 (SPEC/01 §6); nothing reads it before.
name: refagent

# Threshold Owner: the agent model id + version + region (A-vs-A compares
# the pair). Sonnet 4.6's id carries no version suffix. `version` stays null
# under ruling G: the field records what Bedrock returns, and Bedrock returns
# no version for this model. That is not asserted here, it is recorded —
# `milestones/M01/runs/model_lifecycle.txt` holds the listing, dated
# 2026-09-20, account 581208540944: one id, no suffix, modelLifecycle ACTIVE.
# The cold review asked (B4), because this is the only unversioned Anthropic
# pin in this file while m04_equivalent_swap and the rest carry dated ones.
#
# Re-ruled at M01 PR 2 (ruling p, rulings/pr2-threshold-owner.md). It was
# anthropic.claude-sonnet-5, pinned on modelLifecycle: ACTIVE. That reading
# was wrong: ACTIVE says the model exists in the region, not that this
# account may call it, and Converse returned AccessDeniedException,
# "anthropic.claude-sonnet-5 is not available for this account", on all
# fifteen goldens (run 35529132275).
#
# **Verified by a call, not by a listing** (2026-09-20, account 581208540944,
# us-west-2): `converse` on us.anthropic.claude-sonnet-4-6 answered, and
# refagent's own path answered g-001 with table_row r-019 and clause ML-2.1,
# one tool call, 3,533 tokens. `scripts/check_model_access.py` is what
# re-runs that check.
#
# Converse is called through the profile; the region is the request region,
# the profile ARN's (M01 open item 23). The profile routes to us-east-1,
# us-east-2 and us-west-2 (get-inference-profile, 2026-09-20).
model:
  id: anthropic.claude-sonnet-4-6
  version: null
  profile: us.anthropic.claude-sonnet-4-6
  region: us-west-2

# Threshold Owner: the judge model id. Picked at M03 PR 1 from the
# candidates below by scoring the graded-examples set (R6).
judge_model_id: null

# Rule Owner: the guardrail id and version. M03.
guardrail: null

# Security (ruling d): AWS service names only at M01, one VPC endpoint each.
# The agent's security group egress allows these and nothing else; anything
# outside the enum is refused at synth. Arbitrary hostnames are M05.
# bedrock-runtime: Converse. dynamodb: the rights table. kms: the agent's
# key. logs: its own log group. s3: the gateway endpoint, for nothing at M01
# but the runtime's own image layers.
endpoint_allowlist:
  - bedrock-runtime
  - dynamodb
  - kms
  - logs
  - s3

# Security: seat -> IdP group. No IdP groups exist yet; validate checks them
# against real groups from M02 (SPEC/00 §5).
seats:
  product: null
  rule-owner: null
  data-owner: null
  tool-owner: null
  threshold-owner: null
  security: null
  engineering: null

# Tool Owner: edges. Empty at M01. `ratings-helper` is cut to M02 with the
# two-sided edge check (SPEC/01 §10, ruling SCOPE).
may_call: []
may_be_called_by: []

# Tool Owner: ceilings (SPEC/00 §6). Read by validate from M02, when an edge
# exists.
ceilings:
  concurrency: 2
  rps_per_edge: 1
  depth: 2
  fan_out: 3

# Threshold Owner. The eval role's Bedrock budget is Security's and is
# separate (ruling a).
max_tokens_per_session: 20000
daily_usd: 10

# Not wired at M01 (SPEC/01 §10, ruling SCOPE): no memory, no knowledge base
# over data/corpus/ (M03), no HITL branch (M07). `data_class` is
# informational in the PoC (SPEC/00 §12).
memory: null
data_class: internal
deprecated_after: null
rollout: all-at-once

# The platform tag this bundle is built against.
platform_version: m00

# Threshold Owner: every other role's pinned id, resolved 2026-09-18 in
# us-west-2 (milestones/M00/README.md, "Model ids"). Read by the milestone
# that names each role; statuses and reasons stay in that table.
pinned_roles:
  baseline:  # the control, frozen at m00 (ADR-0002); not refagent's model
    id: amazon.nova-micro-v1:0
    profile: us.amazon.nova-micro-v1:0
  # Was anthropic.claude-sonnet-4-6, which is refagent's own model from M01
  # PR 2: a swap to the model already under test measures nothing. Sonnet 4.5
  # is the sibling, and it answers (2026-09-20).
  m04_equivalent_swap:
    id: anthropic.claude-sonnet-4-5-20250929-v1:0
    profile: us.anthropic.claude-sonnet-4-5-20250929-v1:0
  m04_cheaper_swap:
    id: anthropic.claude-haiku-4-5-20251001-v1:0
    profile: us.anthropic.claude-haiku-4-5-20251001-v1:0
  # Already refused on 2026-09-20, and not by access: ResourceNotFoundException,
  # "marked by provider as Legacy and you have not been actively using the
  # model in the last 30 days". A deprecation plant that cannot be called even
  # once cannot show a before. M04 rules whether that is the plant it wants.
  m04_deprecation_plant:
    id: anthropic.claude-sonnet-4-20250514-v1:0
    profile: us.anthropic.claude-sonnet-4-20250514-v1:0
  m04_breaking_swap:
    id: meta.llama3-1-8b-instruct-v1:0
    profile: us.meta.llama3-1-8b-instruct-v1:0
  m03_judge_candidates:
    - {id: meta.llama4-maverick-17b-instruct-v1:0, profile: us.meta.llama4-maverick-17b-instruct-v1:0}
    - {id: meta.llama3-3-70b-instruct-v1:0, profile: us.meta.llama3-3-70b-instruct-v1:0}
    - {id: mistral.mistral-large-2407-v1:0, profile: null}  # ON_DEMAND only
    - {id: openai.gpt-oss-120b-1:0, profile: null}  # ON_DEMAND only
    # Not available to this account on 2026-09-20 (AccessDeniedException).
    # M03 picks from the candidates that answer, or the seat gets access first.
    - {id: openai.gpt-6-astra, profile: us.openai.gpt-6-astra, available: false}
    - {id: amazon.nova-pro-v1:0, profile: us.amazon.nova-pro-v1:0}
