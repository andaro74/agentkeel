<svg width="980" height="880" viewBox="0 0 980 880" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace,'Cascadia Mono',Consolas,Menlo,monospace">
  <!--
    The README's "how it works" diagram. Same palette family as
    docs/assets/readme-header.html; one hue per step: cyan = the question
    and the record, blue = the door, amber = the agent and its answer,
    rose = the guardrail, green = the data and the registry, violet = the
    seats, slate = the signed deploy. Each box carries a plain sentence for
    a reader who does not build software and the service or file name for
    one who does. None of CLAUDE.md's three restricted words; no number.
    Every service named is imported under infra/ or used in
    .github/workflows/deploy.yml. No account id, host or identifier.
  -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b7091"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="978" height="878" rx="16" fill="#0d1a2e" stroke="#2c3d5c" stroke-width="1.5"/>

  <!-- the question (cyan) -->
  <rect x="90" y="34" width="470" height="92" rx="10" fill="#0f2a3a" stroke="#22d3ee" stroke-width="2"/>
  <text x="325" y="62" text-anchor="middle" fill="#a5f3fc" font-size="15" font-weight="bold" letter-spacing="1">A QUESTION</text>
  <text x="325" y="86" text-anchor="middle" fill="#dbe4f0" font-size="12.5">Can we publish this title in this territory,</text>
  <text x="325" y="105" text-anchor="middle" fill="#dbe4f0" font-size="12.5">on this platform, on this date?</text>

  <text x="610" y="64" fill="#8b9bb4" font-size="11.5">asked by a caller the agent's</text>
  <text x="610" y="82" fill="#8b9bb4" font-size="11.5">manifest names, or by the</text>
  <text x="610" y="100" fill="#8b9bb4" font-size="11.5">platform's own test run</text>

  <line x1="325" y1="126" x2="325" y2="206" stroke="#5b7091" stroke-width="1.5" marker-end="url(#arr)"/>
  <circle cx="325" cy="146" r="3.5" fill="#f0a43a"/>

  <!-- the platform boundary: the agent account -->
  <rect x="50" y="176" width="880" height="436" rx="14" fill="rgba(19,33,58,0.35)" stroke="#3f5578" stroke-width="1.5" stroke-dasharray="7 7"/>
  <rect x="528" y="165" width="378" height="22" rx="3" fill="#0a1526"/>
  <text x="540" y="181" fill="#cbd6e6" font-size="12" letter-spacing="3">AGENTKEEL &#183; THE AGENT ACCOUNT ON AWS</text>

  <!-- 1 the door (blue) -->
  <rect x="90" y="212" width="470" height="78" rx="10" fill="#12253f" stroke="#4da3ff" stroke-width="2"/>
  <circle cx="122" cy="251" r="14" fill="#4da3ff"/>
  <text x="122" y="256" text-anchor="middle" fill="#0d1a2e" font-size="14" font-weight="bold">1</text>
  <text x="152" y="238" fill="#bfdcff" font-size="15" font-weight="bold" letter-spacing="1">THE DOOR</text>
  <text x="152" y="259" fill="#dbe4f0" font-size="12.5">Only a caller the agent's manifest names gets in.</text>
  <text x="152" y="277" fill="#8b9bb4" font-size="11">Amazon API Gateway &#183; AWS Lambda &#183; Amazon Cognito</text>

  <line x1="325" y1="290" x2="325" y2="310" stroke="#5b7091" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 2 the agent (amber) -->
  <rect x="90" y="314" width="470" height="84" rx="12" fill="#182a47" stroke="#f0a43a" stroke-width="2.5"/>
  <circle cx="122" cy="356" r="14" fill="#f0a43a"/>
  <text x="122" y="361" text-anchor="middle" fill="#0d1a2e" font-size="14" font-weight="bold">2</text>
  <text x="152" y="342" fill="#ffe1ad" font-size="15" font-weight="bold" letter-spacing="1">THE AGENT</text>
  <text x="152" y="364" fill="#dbe4f0" font-size="12.5">Looks up one row of its table through its one tool.</text>
  <text x="152" y="383" fill="#8b9bb4" font-size="11">Bedrock AgentCore Runtime, in a VPC with no route out</text>

  <line x1="325" y1="398" x2="325" y2="418" stroke="#5b7091" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 3 the guardrail (rose) -->
  <rect x="90" y="422" width="470" height="78" rx="10" fill="#2a1a30" stroke="#f472b6" stroke-width="2"/>
  <circle cx="122" cy="461" r="14" fill="#f472b6"/>
  <text x="122" y="466" text-anchor="middle" fill="#0d1a2e" font-size="14" font-weight="bold">3</text>
  <text x="152" y="448" fill="#fcd0e4" font-size="15" font-weight="bold" letter-spacing="1">THE GUARDRAIL</text>
  <text x="152" y="469" fill="#dbe4f0" font-size="12.5">Every model call carries the agent's pinned rules.</text>
  <text x="152" y="487" fill="#8b9bb4" font-size="11">Bedrock Guardrails &#183; rules/baseline.yaml + the agent's own</text>

  <line x1="325" y1="500" x2="325" y2="520" stroke="#5b7091" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 4 the answer (amber outline) -->
  <rect x="90" y="524" width="470" height="66" rx="10" fill="#0a1526" stroke="#f0a43a" stroke-width="1.5"/>
  <circle cx="122" cy="557" r="14" fill="none" stroke="#f0a43a" stroke-width="2"/>
  <text x="122" y="562" text-anchor="middle" fill="#f0c37a" font-size="14" font-weight="bold">4</text>
  <text x="152" y="551" fill="#f0c37a" font-size="15" font-weight="bold" letter-spacing="1">THE ANSWER</text>
  <text x="152" y="573" fill="#dbe4f0" font-size="12.5">Cites one table row and one contract clause.</text>

  <!-- right column, inside the platform: what surrounds the path -->
  <!-- seven seats (violet) -->
  <rect x="610" y="212" width="290" height="100" rx="10" fill="#182342" stroke="#a78bfa" stroke-width="2"/>
  <text x="630" y="240" fill="#ddd2fe" font-size="15" font-weight="bold" letter-spacing="1">SEVEN SEATS</text>
  <text x="630" y="263" fill="#dbe4f0" font-size="12.5">A rule, test or bar changes only</text>
  <text x="630" y="281" fill="#dbe4f0" font-size="12.5">with its owner's ruling.</text>
  <text x="630" y="300" fill="#8b9bb4" font-size="11">.github/CODEOWNERS &#183; src/gates/</text>

  <!-- signed deploy (slate) -->
  <rect x="610" y="326" width="290" height="84" rx="10" fill="#151f33" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="630" y="353" fill="#e2e8f0" font-size="15" font-weight="bold" letter-spacing="1">SIGNED DEPLOY</text>
  <text x="630" y="375" fill="#dbe4f0" font-size="12.5">Only CI's signed bundle deploys.</text>
  <text x="630" y="394" fill="#8b9bb4" font-size="11">cosign &#183; GitHub OIDC &#183; AWS CDK</text>

  <!-- the agent's table (green) -->
  <line x1="560" y1="356" x2="582" y2="356" stroke="#5b7091" stroke-width="1.5"/>
  <path d="M582 356 L582 461 L606 461" stroke="#5b7091" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <circle cx="582" cy="356" r="3.5" fill="#f0a43a"/>
  <rect x="610" y="424" width="290" height="76" rx="10" fill="#12283b" stroke="#34d399" stroke-width="2"/>
  <text x="630" y="450" fill="#a7f3d0" font-size="15" font-weight="bold" letter-spacing="1">THE AGENT'S TABLE</text>
  <text x="630" y="471" fill="#dbe4f0" font-size="12.5">The truth the agent answers from.</text>
  <text x="630" y="489" fill="#8b9bb4" font-size="11">Amazon DynamoDB &#183; one KMS key per agent</text>

  <!-- registry (green) -->
  <rect x="610" y="514" width="290" height="76" rx="10" fill="#12283b" stroke="#34d399" stroke-width="2"/>
  <text x="630" y="540" fill="#a7f3d0" font-size="15" font-weight="bold" letter-spacing="1">REGISTRY</text>
  <text x="630" y="561" fill="#dbe4f0" font-size="12.5">Each deployed agent has one row.</text>
  <text x="630" y="579" fill="#8b9bb4" font-size="11">Amazon DynamoDB &#183; Amazon Athena &#183; Grafana</text>

  <!-- out of the agent account: the record -->
  <line x1="325" y1="590" x2="325" y2="672" stroke="#5b7091" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- the security account boundary -->
  <rect x="50" y="646" width="880" height="126" rx="14" fill="rgba(19,33,58,0.35)" stroke="#3f5578" stroke-width="1.5" stroke-dasharray="7 7"/>
  <rect x="588" y="635" width="318" height="22" rx="3" fill="#0a1526"/>
  <text x="600" y="651" fill="#cbd6e6" font-size="12" letter-spacing="3">A SEPARATE SECURITY ACCOUNT</text>

  <!-- 5 the record (cyan) -->
  <rect x="90" y="676" width="470" height="78" rx="10" fill="#0f2a3a" stroke="#22d3ee" stroke-width="2"/>
  <circle cx="122" cy="715" r="14" fill="#22d3ee"/>
  <text x="122" y="720" text-anchor="middle" fill="#0d1a2e" font-size="14" font-weight="bold">5</text>
  <text x="152" y="702" fill="#a5f3fc" font-size="15" font-weight="bold" letter-spacing="1">THE RECORD</text>
  <text x="152" y="723" fill="#dbe4f0" font-size="12.5">Who asked, what was refused, what was answered.</text>
  <text x="152" y="741" fill="#8b9bb4" font-size="11">AWS CloudTrail &#183; VPC flow logs &#183; the door's access log</text>

  <line x1="560" y1="715" x2="606" y2="715" stroke="#5b7091" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="610" y="676" width="290" height="78" rx="10" fill="#0f2a3a" stroke="#22d3ee" stroke-width="2"/>
  <text x="630" y="702" fill="#a5f3fc" font-size="15" font-weight="bold" letter-spacing="1">AUDIT BUCKET</text>
  <text x="630" y="723" fill="#dbe4f0" font-size="12.5">The agent account cannot edit it.</text>
  <text x="630" y="741" fill="#8b9bb4" font-size="11">Amazon S3 with Object Lock (one day)</text>

  <!-- footer notes -->
  <text x="90" y="806" fill="#8b9bb4" font-size="11.5"><tspan fill="#f0a43a">&#9679;</tspan>&#160; the door is built for an agent whose manifest names callers; the reference agent has none</text>
  <text x="90" y="828" fill="#8b9bb4" font-size="11.5"><tspan fill="#f0a43a">&#9679;</tspan>&#160; a request to the internet is dropped and leaves no record: ledger rows 5 and 8, RED</text>
  <text x="90" y="850" fill="#667799" font-size="11.5"><tspan fill="#f0a43a">&#9679;</tspan>&#160; a proof of concept &#183; the reference agent's film slate is fictional</text>
</svg>
