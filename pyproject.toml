[project]
name = "agentkeel"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.97",
    "cryptography>=45",  # src/bundle/verify.py reads the signing certificate (M01 PR 2)
    "jsonschema>=4.26.0",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "typer>=0.27.2",
]

[dependency-groups]
dev = [
    "moto>=5.2.3",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
infra = [
    "aws-cdk-lib>=2.270.0",
    "cdk-nag>=2.37,<3",
    "constructs>=10.8.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
